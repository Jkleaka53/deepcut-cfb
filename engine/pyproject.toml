[project]
name = "cfbm"
version = "0.1.0"
description = "CFB Matchups stats engine (not for gambling or betting)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.1",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cfbm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "responses>=0.26.3",
]
